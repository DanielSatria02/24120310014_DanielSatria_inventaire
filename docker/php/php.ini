; Development-friendly PHP settings for the Inventaire container.

date.timezone = Asia/Jakarta

memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60

expose_php = Off

opcache.enable = 1
; Pick up code changes immediately (development).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0