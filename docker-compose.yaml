name: inventaire

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: inventaire-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: inventaire
      DB_USERNAME: inventaire
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
    volumes:
      # Source code (live edits without rebuilding the image).
      - ./:/var/www/html
      # Keep the dependencies and compiled assets built into the image,
      # instead of being hidden by the bind mount above.
      - vendor:/var/www/html/vendor
      - public-build:/var/www/html/public/build
    networks:
      - inventaire

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - public-build:/var/www/html/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - inventaire

  # Optional: rebuild the compiled assets into the public-build volume.
  #   docker compose --profile assets run --rm assets
  assets:
    image: node:22-alpine
    profiles: ["assets"]
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node-modules:/var/www/html/node_modules
      - public-build:/var/www/html/public/build
    command: sh -c "npm install --no-audit --no-fund && npm run build"
    networks:
      - inventaire

  # Optional: Vite dev server with hot reload.
  #   docker compose --profile vite up -d vite
  vite:
    image: node:22-alpine
    profiles: ["vite"]
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node-modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app
    networks:
      - inventaire

volumes:
  vendor:
  public-build:
  db-data:
  node-modules:

networks:
  inventaire:
    driver: bridge