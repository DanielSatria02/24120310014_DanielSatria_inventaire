name: inventaire

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventaire-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      # The database is external: credentials are read from your local .env.
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      # Set to false if you do not want `php artisan migrate` on every start.
      RUN_MIGRATIONS: "true"
    volumes:
      # Source code (live edits without rebuilding the image).
      - ./:/var/www/html
      # Keep the dependencies and compiled assets built into the image,
      # instead of being hidden by the bind mount above.
      - vendor:/var/www/html/vendor
      - public-build:/var/www/html/public/build
    healthcheck:
      # PHP-FPM only starts after the entrypoint has run migrations, so this
      # also means the application is ready. Makes `docker compose up --wait`
      # actually wait for a usable stack.
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - inventaire

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - public-build:/var/www/html/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      app:
        condition: service_healthy
    networks:
      - inventaire

  # Optional: rebuild the compiled assets into the public-build volume.
  #   docker compose --profile assets run --rm assets
  assets:
    image: node:22-alpine
    profiles: ["assets"]
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node-modules:/var/www/html/node_modules
      - public-build:/var/www/html/public/build
    command: sh -c "npm ci --no-audit --no-fund && npm run build"
    networks:
      - inventaire

  # Optional: Vite dev server with hot reload.
  #   docker compose --profile vite up -d vite
  vite:
    image: node:22-alpine
    profiles: ["vite"]
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node-modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app
    networks:
      - inventaire

volumes:
  vendor:
  public-build:
  node-modules:

networks:
  inventaire:
    driver: bridge